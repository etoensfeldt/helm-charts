suite: permissions of the router
templates:
  - templates/rbac.yaml
  - templates/deployment.yaml
release:
  name: r1
  namespace: ns1
tests:
  - it: creates no role or binding without the project auto-update
    template: templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts no API token into the router pod without the project auto-update
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: grants the auto-update only listing and deleting pods in its namespace
    template: templates/rbac.yaml
    set:
      project:
        projectRepo: https://example.com/project.git
        autoUpdate:
          disable: false
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: Role
      - documentIndex: 0
        equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["list", "deletecollection"]
      - documentIndex: 1
        isKind:
          of: RoleBinding
      - documentIndex: 1
        equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: r1-opc-router-restart

  - it: mounts the API token when the project auto-update needs it
    template: templates/deployment.yaml
    set:
      project:
        projectRepo: https://example.com/project.git
        autoUpdate:
          disable: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

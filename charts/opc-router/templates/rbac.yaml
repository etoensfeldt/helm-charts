{{- if and .Values.project.projectRepo (not .Values.project.autoUpdate.disable) }}
# The project auto-update restarts the router pod after a new commit, through the API on behalf of
# the pod's service account. It needs to list and delete this release's router pods, nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s" (include "opc-router.fullname" .) "restart" | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "opc-router.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s" (include "opc-router.fullname" .) "restart" | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "opc-router.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opc-router.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s" (include "opc-router.fullname" .) "restart" | trunc 63 | trimSuffix "-" }}
{{- end }}
